# Prometheus scrapes the Collector's exporter. Retention is a command-line flag on the service in compose.yml
# (PROMETHEUS_RETENTION, 15d by default), not a setting in this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
